# MAINTENANCE NOTES
# -----------------
#
# * Any backwards incompatible inputs require a major version change.
# * Ordinarily for the same major+minor `dk-version` that cache should be compatible across patch versions.
#   But if a dk0 patch release accidentally corrupts a cache, search/replace and bump "-x1" to evict
#   _every_ user cache AND put a note in the release notes AND put a
#   "⚠️ warning: cache evicted administratively" as a GitHub step for at least a week. You might make
#   that easier for users by using a `if:` on the cache to use a bump (ex. "-x1" -> "-x2") only for
#   the affected major+minor `dk-version`
name: 'Distribute dk modules'
description: 'Distribute your dk modules in your GitHub Action workflow'
branding:
  icon: cloud-lightning
  color: 'gray-dark'
inputs:
  dk-version:
    description: 'The version of the dk build system to use. The default is the latest version.'
    required: false
    default: '2.5'
  id:
    description: 'The library and version of your distribution. Ex. CommonsBase_Std@1.0.1. The version must be valid semver. Any semver build metadata (a "+" and [0-9A-Za-z-] characters) is stripped.'
    required: false # true does nothing
  pubkey:
    description: 'Your public key for the distribution version.'
    required: false # Give nice error message if empty in `steps`
  seckey:
    description: 'Your secret key for the distribution version.'
    required: false # Give nice error message if empty in `steps`
  cramtest:
    description: 'The location of the distribution cram test. Example: etc/dk/v/CommonsBase_LLVM/dist-win32.t'
    required: false # true does nothing
  use-cache:
    description: 'Whether to cache value stores and trace stores between runs.'
    required: false
    default: 'false'
  options:
    description: 'Options to pass to `dk` and/or `dk0`. Default is `-I etc/dk/v`'
    required: false
    default: '-I etc/dk/v'
  experimental-mlfront-owner:
    description: "The 'dk' repository owner's username. The GitHub repository would then be github.com/<owner>/dk.git. Defaults to 'diskuv'. Do not use for production."
    required: false
    default: 'diskuv'
  experimental-mlfront-ref:
    description: 'Use the bleeding edge of https://gitlab.com/dkml/build-tools/MlFront.git. Do not use for production.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
      - name: Check Runner OS
        if: runner.os != 'Linux' && runner.os != 'Windows' && runner.os != 'macOS'
        shell: bash
        run: |
          echo "::error title=⛔ error hint::Support Linux, Windows, and macOS Only"
          exit 1

      - name: Check Library Id and Version
        if: inputs.id == ''
        shell: bash
        run: |
          echo "::error title=⛔ error hint::Missing required input. You need to set the 'id' input in the `with:` block of the workflow step."
          exit 1

      - name: Check Objects and Scripts
        if: inputs.objects == '' && inputs.scripts == ''
        shell: bash
        run: |
          echo "::error title=⛔ error hint::Missing required input. You need to set the 'objects' or 'scripts' input or both in the `with:` block of the workflow step."
          exit 1

      - name: Set DK variables
        id: dk-vars
        shell: bash
        run: |
          case "${{ inputs.dk-version }}" in
            2.4) DK_BUILD_VERSION_REF=V2_4; DK_BUILD_VERSION_MAJMIN=2.4 ;;
            2.5) DK_BUILD_VERSION_REF=V2_5; DK_BUILD_VERSION_MAJMIN=2.5 ;;
            *) echo "::error title=⛔ error hint::Unsupported version '${{ inputs.dk-version }}'. Supported versions: 2.4, 2.5"; exit 1 ;;
          esac
          echo "dk_build_version_ref=${DK_BUILD_VERSION_REF}" >> "$GITHUB_OUTPUT"
          echo "dk_build_version_majmin=${DK_BUILD_VERSION_MAJMIN}" >> "$GITHUB_OUTPUT"

          # split id into library_id and version
          if [[ "$${{ inputs.id }}" != *@* ]]; then
            echo "::error title=⛔ error hint::Invalid id '${{ inputs.id }}'. Must be of the form SomeLibrary_Unit@Version, like CommonsBase_Std@1.0.1"
            exit 1
          fi
          DK_ID="${{ inputs.id }}"
          DK_ID_LIBRARY="${DK_ID%@*}"
          DK_ID_VERSION="${DK_ID#*@}"
          if [[ -z "$DK_ID_LIBRARY" || -z "$DK_ID_VERSION" ]]; then
            echo "::error title=⛔ error hint::Invalid id '${{ inputs.id }}'. Must be of the form SomeLibrary_Unit@Version, like CommonsBase_Std@1.0.1"
            exit 1
          fi

          # validate version is valid semver using suggested semver regex
          # from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
          if command -v perl; then
            if ! perl -e 'exit 1 unless shift =~ /^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?P<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;' "$DK_ID_VERSION"; then
              echo "::error title=⛔ error hint::Invalid version '${DK_ID_VERSION}' in id '${{ inputs.id }}'. Version must be valid semver, like 1.0.1 or 1.0.0+some-build-metadata"
              exit 1
            fi
          else
            echo "::warning title=⚠️ warning hint::perl not found. Skipping semver validation for version '${DK_ID_VERSION}' in id '${{ inputs.id }}'. Version must be valid semver, like 1.0.1 or 1.0.0+some-build-metadata"
          fi

          # strip build metadata from version
          DK_ID_VERSION="${DK_ID_VERSION%%+*}"

          echo "dk_id_library=${DK_ID_LIBRARY}" >> "$GITHUB_OUTPUT"
          echo "dk_id_version=${DK_ID_VERSION}" >> "$GITHUB_OUTPUT"

          # convert version like 1.2.3 to underscore separated major and minor version like 1_2
          DK_ID_VERSION_MAJMINUNDER=$(printf "%s" "${DK_ID_VERSION}" | awk -F. '{print $1"_"$2}')
          echo "dk_id_version_majminunder=${DK_ID_VERSION_MAJMINUNDER}" >> "$GITHUB_OUTPUT"

      - name: Check Key Pairs
        if: inputs.pubkey == '' || inputs.seckey == ''
        shell: bash
        # Produce message like:
        # > Distribution keypair missing. You need to populate 'distribute_2_4_pubkey' and 'distribute_2_4_seckey' in the Secrets for your workflow. See more in https://docs.github.com/en/actions/security-guides/encrypted-secrets. Then set the 'pubkey' and 'seckey' inputs in the 'with:' block of the workflow step, like: pubkey: ${{ secrets.distribute_2_4_pubkey }} seckey: ${{ secrets.distribute_2_4_seckey }}
        run: |
          echo "::error title=⛔ error hint::Distribution keypair missing. You need to populate 'distribute_${{ steps.dk-vars.outputs.dk_id_version_majminunder }}_pubkey' and 'distribute_${{ steps.dk-vars.outputs.dk_id_version_majminunder }}_seckey' in the Secrets for your workflow. See more in https://docs.github.com/en/actions/security-guides/encrypted-secrets. Then set the 'pubkey' and 'seckey' inputs in the 'with:' block of the workflow step, like the following on two lines: ${{ format('pubkey: {0}{1}{1} secrets.distribute_{3}_pubkey {2}{2} seckey: {0}{1}{1} secrets.distribute_{3}_seckey {2}{2}', '\$', '{', '}', steps.dk-vars.outputs.dk_id_version_majminunder) }}"
          exit 1

      # --------- C.1: Get dksrc/dk0 ----------

      - name: Get dksrc/dk0
        if: >
          inputs.experimental-mlfront-owner != ''
          && (inputs.experimental-mlfront-ref == '' || inputs.experimental-mlfront-ref == 'false')
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.experimental-mlfront-owner }}/dk
          path: dksrc
          ref: ${{ steps.dk-vars.outputs.dk_build_version_ref }}

      - name: Get dksrc/dk0
        if: >
          inputs.experimental-mlfront-owner == ''
          && (inputs.experimental-mlfront-ref == '' || inputs.experimental-mlfront-ref == 'false')
        uses: actions/checkout@v5
        with:
          repository: diskuv/dk
          path: dksrc
          ref: ${{ steps.dk-vars.outputs.dk_build_version_ref }}

      # --------- C.2: Install dksrc/dk0 ----------
      - name: Set-up OCaml
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        uses: ocaml/setup-ocaml@57d9aa353e8d39677b1b9fc39637d48f27fe4a91 # v3
        with:
          ocaml-compiler: 5.4.0
          #   (synced from OCAML_OPAM_REPOSITORY in MlFront/.gitlab-ci.yml)
          #   2025-11-08. dkml-c-probe.3.2.0
          #   2025-10-10. initial
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#88e773ad9e5a6ed02fb2c1fab59e649624ac9db4
          cache-prefix: dk-distribute-v1
      - name: Get MlFront
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        #   `git commit` required since `opam pin`` uses git+file://
        run: |
          git clone https://gitlab.com/dkml/build-tools/MlFront.git
          cd MlFront
          git reset --hard '${{ inputs.experimental-mlfront-ref }}'

          sh ci/localize-pristine.sh
          git config user.email "nobody@example.com"
          git config user.name "nobody"
          git add --force dune-project *.opam
          git commit -m "pristine"

          printf 'opam version: '
          opam --version
      - name: Pin Latest MlFront
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        run: cd MlFront && opam pin . --no-action -y
      - name: Install MlFront_Exec
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        # Use `./MlFront_Exec.opam` not `MlFront_Exec` to process pin-depends:[]
        run: cd MlFront && opam install ./MlFront_Exec.opam -y
      - name: Create dksrc/dk0 Wrapper on Unix
        if: runner.os != 'Windows' && inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        run: |
          install -d dksrc
          printf '#!/bin/sh\nset -euf\nopam exec -- dk0 "$@"\n' | tee dksrc/dk0
          chmod +x dksrc/dk0
      - name: Create dksrc\dk0.cmd Wrapper on Windows
        if: runner.os == 'Windows' && inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dksrc -Force | Out-Null
          $content = "@echo off`nsetlocal enabledelayedexpansion`nopam exec -- dk0 %*`n"
          Set-Content -Path dksrc\dk0.cmd -Value $content -Encoding ASCII

      # --------- E.1 Cache Restore ----------
      - name: Cache restore dk stores
        if: inputs.use-cache != ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: restore-cache-dk-distribute
        with:
            # The data stores (and build keys) are safe to share between Windows, macOS and Linux
            enableCrossOsArchive: true
            #   SYNC: must match Cache Save below
            path: t
            #   SYNC: must match Cache Save below.
            key: dk-stores-and-keys-x1-${{ steps.dk-vars.outputs.dk_build_version_majmin }}-${{ github.run_id }} # update cache on every run
            restore-keys: dk-stores-and-keys-x1-${{ steps.dk-vars.outputs.dk_build_version_majmin }}             # use latest cache for this version


      # --------- G.1 Distribute ----------

      - name: Distribute on Unix
        env:
            DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
            DK_BUILD_SECKEY: "${{ inputs.seckey }}"
        shell: bash
        if: runner.os != 'Windows'
        # --trial --errors-plain option helps cross-platform CI caches since the cache+data is under the project t/ subdirectory
        run: |
          echo distribute and combine ...
          shopt -s extglob # leading and trailing space trim
          # note: IFS+read works on macOS bash 5.2, unlike readarray

          # 'OBJECTS_ARRAY' and 'SCRIPTS_ARRAY':
          # bash array from the comma-separated or newline-separated input 'objects' and 'scripts'
          set +e
          IFS=$'\n,' read -r -d '' -a OBJECTS_ARRAY <<< "${{ inputs.objects }}"
          IFS=$'\n,' read -r -d '' -a SCRIPTS_ARRAY <<< "${{ inputs.scripts }}"
          set -e
          TRIMMED_OBJECTS=()
          for i in "${!OBJECTS_ARRAY[@]}"; do
            str="${OBJECTS_ARRAY[$i]}"
            str="${str##*( )}" # leading
            str="${str%%*( )}" # trailing
            TRIMMED_OBJECTS+=("$str")
          done
          TRIMMED_SCRIPTS=()
          for i in "${!SCRIPTS_ARRAY[@]}"; do
            str="${SCRIPTS_ARRAY[$i]}"
            str="${str##*( )}" # leading
            str="${str%%*( )}" # trailing
            TRIMMED_SCRIPTS+=("$str")
          done

          part=1
          for object in "${TRIMMED_OBJECTS[@]}"; do
            echo "Building object $object: dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -o $object"
            dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -o "$object"
            part=$((part + 1))
          done
          for script in "${TRIMMED_SCRIPTS[@]}"; do
            echo "Building script module $script: dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -s $script"
            dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -s "$script"
            part=$((part + 1))
          done

          echo "Collecting tracestore: dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-valuestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}'"
          dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-valuestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}'

          echo "Combining: dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'"
          dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'

          du -sh dk-dist/*

      - name: Query traces on Unix
        env:
            DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
            DK_BUILD_SECKEY: "${{ inputs.seckey }}"
            OCAMLRUNPARAM: b
        shell: bash
        if: runner.os != 'Windows'
        run: |
          dksrc/dk0 --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD query

      - name: Distribute on Windows
        env:
            DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
            DK_BUILD_SECKEY: "${{ inputs.seckey }}"
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Write-Host "distribute and combine ..."

          # 'OBJECTS_ARRAY' and 'SCRIPTS_ARRAY':
          # PowerShell array from the comma-separated or newline-separated input 'objects' and 'scripts'
          $OBJECTS_ARRAY = "${{ inputs.objects }}" -split "[,`n]+"
          $SCRIPTS_ARRAY = "${{ inputs.scripts }}" -split "[,`n]+"
          $TRIMMED_OBJECTS = @()
          foreach ($form in $OBJECTS_ARRAY) {
            $trimmed = $form.Trim()
            if ($trimmed -ne "") {
              $TRIMMED_OBJECTS += $trimmed
            }
          }
          $TRIMMED_SCRIPTS = @()
          foreach ($rule in $SCRIPTS_ARRAY) {
            $trimmed = $rule.Trim()
            if ($trimmed -ne "") {
              $TRIMMED_SCRIPTS += $trimmed
            }
          }

          $part = 1
          foreach ($object in $TRIMMED_OBJECTS) {
            Write-Host "Building object ${object}: dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -o $object"
            dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -o $object
            if ($LASTEXITCODE -ne 0) {
              throw "dk0 distribute failed with exit code $LASTEXITCODE"
            }
            $part++
          }
          foreach ($script in $TRIMMED_SCRIPTS) {
            Write-Host "Building script module ${script}: dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -s $script"
            dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-tracestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' -s $script
            if ($LASTEXITCODE -ne 0) {
              throw "dk0 distribute failed with exit code $LASTEXITCODE"
            }
            $part++
          }

          Write-Host "Collecting tracestore: dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-valuestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}'"
          dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_id_library }}-$part --no-valuestore --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}'
          if ($LASTEXITCODE -ne 0) {
            throw "dk0 distribute failed with exit code $LASTEXITCODE"
          }

          Write-Host "Combining: dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'"
          dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'
          if ($LASTEXITCODE -ne 0) {
            throw "dk0 combine failed with exit code $LASTEXITCODE"
          }

          Get-ChildItem -Directory dk-dist | ForEach-Object {
              $size = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
              $sizeGB = [math]::Round($size / 1GB, 2)
              Write-Output "$($sizeGB) GB`t$($_.Name)"
          }

      - name: Query traces on Windows
        env:
            DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
            DK_BUILD_SECKEY: "${{ inputs.seckey }}"
            OCAMLRUNPARAM: b
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          dksrc\dk0.cmd --trial --errors-plain ${{ inputs.options }} --keys-env DK_BUILD query
          if ($LASTEXITCODE -ne 0) {
            throw "dk0 query failed with exit code $LASTEXITCODE"
          }

      # --------- X.1 Cache Save ----------
      - name: Cache save dk stores
        if: inputs.use-cache != '' && steps.restore-cache-dk-distribute.outputs.cache-hit == ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: save-cache-dk-distribute
        with:
            # The data stores (and build keys) are safe to share between Windows, macOS and Linux
            enableCrossOsArchive: true
            #   SYNC: must match Cache Load above
            path: t
            #   SYNC: must match Cache Load above
            key: dk-stores-and-keys-x1-${{ steps.dk-vars.outputs.dk_build_version_majmin }}-${{ github.run_id }} # update cache on every run
