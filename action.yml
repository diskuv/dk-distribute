# MAINTENANCE NOTES
# -----------------
#
# * Any backwards incompatible inputs require a major version change.
# * Ordinarily for the same major+minor `dk-version` that cache should be compatible across patch versions.
#   But if a dk0 patch release accidentally corrupts a cache, search/replace and bump "-x1" to evict
#   _every_ user cache AND put a note in the release notes AND put a
#   "⚠️ warning: cache evicted administratively" as a GitHub step for at least a week. You might make
#   that easier for users by using a `if:` on the cache to use a bump (ex. "-x1" -> "-x2") only for
#   the affected major+minor `dk-version`
#
# DOCS
# ----
#
# * STORE: The `store` input selects where the build reads its value/trace stores:
#     - 'release' (default): lazily load value and trace stores from the last release of
#       the same major+minor line via `dk0 restore github-l2`. Only the small value-store
#       indexes are downloaded; value blobs are range-fetched on demand, so store is not
#       bound by the ~10GB all-or-nothing GitHub Actions cache. A missing release will be
#       a clean build.
#     - 'cache': persist value and trace stores in the ~10GB GitHub Actions cache between runs.
#     - 'none': no valuestore and no tracestore => clean build.
name: 'Distribute dk modules'
description: 'Distribute your dk modules in your GitHub Action workflow'
branding:
  icon: cloud-lightning
  color: 'gray-dark'
inputs: # Max 25 inputs is practical limit. https://github.com/orgs/community/discussions/182122
  dk-version:
    description: 'The version of the dk build system to use. The default is the latest version.'
    required: false
    default: '2.5'
  id:
    description: 'The library and version of your distribution. Defaults to github repository (without the owner) plus @ plus the github reference (ie. tag or branch). Ex. CommonsBase_Std@1.0.1. The version must be valid semver. Any semver build metadata (a "+" and [0-9A-Za-z-] characters) is stripped.'
    required: false # true does nothing
  pubkey:
    description: 'Your public key for the distribution version.'
    required: false # Give nice error message if empty in `steps`
  seckey:
    description: 'Your secret key for the distribution version.'
    required: false # Give nice error message if empty in `steps`
  distscript:
    description: 'The location of the distribution scripts. Do not add /run.t or /run.u to distribution script directories that contain run.t or run.u. Examples: dist-win32.u, dist/Linux_x86_64.u'
    required: false # true does nothing
  store:
    description: >-
      Where the build reads its value and trace stores from. One of:
      "release" (default) lazily loads the value and trace stores from the last
      release, if any, for incremental builds — only the small value-store
      indexes are downloaded and individual value blobs are range-fetched on
      demand, so it is not bound by the size-limited (ex. 10GB), all-or-nothing
      GitHub Actions cache (a missing previous release is a clean build);
      "cache" uses the GitHub Actions cache to persist the value and trace
      stores between runs; "none" uses no valuestore and no tracestore for clean
      builds.
    required: false
    default: 'release'
  options:
    description: 'Options to pass to `dk` and/or `dk0`.'
    required: false
  trust-packages:
    description: >-
      Space-separated package library ids (ex. 'CommonsBase_GNU
      CommonsBase_Win32') whose producer OpenBSD signify keys are accepted
      without an interactive prompt (each becomes a repeated
      `--trust-local-package` option). dk0 denies unknown producer keys by
      default and CI has no terminal to accept them, so list every package
      your workspace imports here, except `CommonsBase_Std` (the built-in dk
      trust root) and this repository's own package (always trusted). It never
      overrides signature verification or the key-rotation rules.
    required: false
    default: ''
  short-build-dir:
    description: 'Optional absolute Windows path like C:\b. When set on Windows, the directory is deleted and recreated before use, a workspace junction is created at <dir>\w, and dk uses <dir>\k, <dir>\d and <dir>\c for keys, data and cache.'
    required: false
    default: ''
  experimental-dk-owner:
    description: "The 'dk' repository owner's username. The GitHub repository would then be github.com/<owner>/dk.git. Defaults to 'diskuv'. Do not use for production."
    required: false
    default: 'diskuv'
  experimental-mlfront-ref:
    description: 'Use the bleeding edge of https://gitlab.com/dkml/build-tools/MlFront.git. Do not use for production. Do not mix experimental MlFront with non-experimental in a multi-job workflow since version checks will fail in "combine" step.'
    required: false
    default: 'false'
  standalone:
    description: 'Whether to run the final combine step in the dk-distribute workflow. Do not use when running distribution scripts on more than one platform.'
    required: false
    default: 'false'
  execution-abi:
    description: 'Set the execution_abi wildcard so executables (compilers, etc.) are selected that run on the ABI.'
    required: false
  target-abi:
    description: 'Set the target_abi wildcard so executables and libraries are generated for the ABI.'
    required: false
  publish-objects:
    description: >-
      Optional. Newline-separated list of built objects to also publish as flat,
      whole-file assets in the distribution (alongside the content-addressed value
      store). Each line is: <object@version>|<zip-member>|<asset-basename>. After
      `distribute`, the action runs `dk0 get-object` for each -- selecting the slot
      from this job's distribution script -- and stages the result into dk-dist/ as
      <asset-basename>-<abi>[.exe] (abi = the lowercased distscript basename; .exe
      only for Windows_* slots), so it is shared, combined, attested, and released
      like any other distribution asset. Example line:
      "CommonsBase_Dk.Dk0@2.4.2|./bin/dk0.exe|dk0". No-op when empty or when
      standalone is 'true'.
    required: false
    default: ''
runs:
  using: composite
  steps:
      - name: Check Runner OS
        if: runner.os != 'Linux' && runner.os != 'Windows' && runner.os != 'macOS'
        shell: bash
        run: |
          echo "::error title=⛔ error hint::Support Linux, Windows, and macOS Only"
          exit 1

      - name: Check Distribution Script
        if: inputs.distscript == ''
        shell: bash
        run: |
          echo "::error title=⛔ error hint::Missing required input. Set the 'distscript' input."
          exit 1

      - name: Check Distribution Script Directory
        if: inputs.distscript != '' && (endsWith(inputs.distscript, '/run.t') || endsWith(inputs.distscript, '/run.u'))
        shell: bash
        run: |
          echo "::error title=⛔ error hint::The distribution script should not end with /run.t or /run.u. Set the 'distscript' input to the directory containing run.t or run.u, like 'dist-Linux_x86_64.u', not 'dist-Linux_x86_64.u/run.t'."
          exit 1

      - name: Set dk-distribute variables
        id: dk-vars
        shell: bash
        env:
          INPUTVERSION: ${{ inputs.dk-version }}
          INPUTDISTSCRIPT: ${{ inputs.distscript }}
          INPUTID: ${{ inputs.id }}
          INPUTTARGETABI: ${{ inputs.target-abi }}
          INPUTTRUSTPACKAGES: ${{ inputs.trust-packages }}
        run: |
          case "${{ env.INPUTVERSION }}" in
            2.4) DK_BUILD_VERSION_REF=V2_4; DK_BUILD_VERSION_MAJMIN=2.4 ;;
            2.5) DK_BUILD_VERSION_REF=V2_5; DK_BUILD_VERSION_MAJMIN=2.5 ;;
            *) echo "::error title=⛔ error hint::Unsupported version '${{ env.INPUTVERSION }}'. Supported versions: 2.4, 2.5"; exit 1 ;;
          esac
          echo "dk_build_version_ref=${DK_BUILD_VERSION_REF}" | tee -a "$GITHUB_OUTPUT"
          echo "dk_build_version_majmin=${DK_BUILD_VERSION_MAJMIN}" | tee -a "$GITHUB_OUTPUT"

          # default 'id' will be github.repository + '@' + github.ref_name except
          # github.repository (owner/repo) will not have the "owner/" prefix.
          # ex. 'repo@1.2.3'
          DK_ID='${{ env.INPUTID }}'
          if [ -z "$DK_ID" ]; then
            DK_ID_REPOSITORY="${{ github.repository }}"
            DK_ID="${DK_ID_REPOSITORY#*/}@${{ github.ref_name }}"
          fi

          # split id into library_id and version
          if [[ "$DK_ID}" != *@* ]]; then
            echo "::error title=⛔ error hint::Invalid id '${{ env.INPUTID }}'. Must be of the form SomeLibrary_Unit@Version, like CommonsBase_Std@1.0.1"
            exit 1
          fi
          DK_ID_LIBRARY="${DK_ID%@*}"
          DK_ID_VERSION="${DK_ID#*@}"
          if [[ -z "$DK_ID_LIBRARY" || -z "$DK_ID_VERSION" ]]; then
            echo "::error title=⛔ error hint::Invalid id '${{ env.INPUTID }}'. Must be of the form SomeLibrary_Unit@Version, like CommonsBase_Std@1.0.1"
            exit 1
          fi

          # validate version is valid semver using suggested semver regex
          # from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
          if command -v perl; then
            if ! perl -e 'exit 1 unless shift =~ /^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?P<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;' "$DK_ID_VERSION"; then
              echo "::error title=⛔ error hint::Invalid version '${DK_ID_VERSION}' in id '${DK_ID}'. Version must be valid semver, like 1.0.1 or 1.0.0+some-build-metadata"
              exit 1
            fi
          else
            echo "::warning title=⚠️ warning hint::perl not found. Skipping semver validation for version '${DK_ID_VERSION}' in id '${DK_ID}'. Version must be valid semver, like 1.0.1 or 1.0.0+some-build-metadata"
          fi

          # strip build metadata from version
          DK_ID_VERSION="${DK_ID_VERSION%%+*}"

          echo "dk_id_library=${DK_ID_LIBRARY}" | tee -a "$GITHUB_OUTPUT"
          echo "dk_id_version=${DK_ID_VERSION}" | tee -a "$GITHUB_OUTPUT"

          # Derive a per-release build number so every release stamps its values
          # with a unique semver build metadata `bn-<DK_BUILD_NUMBER>`.
          #
          # The version's patch component is the release timestamp for dkpkg
          # repos and is identical across all matrix jobs of a single release.
          # Fall back to the dotted version (but with dashes) if there is no patch num.
          DK_BUILD_NUMBER=$(printf "%s" "${DK_ID_VERSION}" | awk -F. '{print $3}')
          if [ -z "$DK_BUILD_NUMBER" ]; then DK_BUILD_NUMBER="${DK_ID_VERSION//./-}"; fi
          echo "dk_build_number=${DK_BUILD_NUMBER}" | tee -a "$GITHUB_OUTPUT"

          # distribution part. <library>-<distscript>[-<targetabi>]
          #   etc/dk/v/XXX/YYY.u -> YYY
          part=$(basename ${{ env.INPUTDISTSCRIPT }})
          part="${part%%.*}"
          #   [-TARGETABI]
          if [ -n "${{ env.INPUTTARGETABI }}" ]; then
            part="${part}-${{ env.INPUTTARGETABI }}"
          fi
          part="${DK_ID_LIBRARY}-${part}"
          echo "dk_dist_part=${part}" | tee -a "$GITHUB_OUTPUT"

          # convert version like 1.2.3 to underscore separated major and minor version like 1_2
          DK_ID_VERSION_MAJMINUNDER=$(printf "%s" "${DK_ID_VERSION}" | awk -F. '{print $1"_"$2}')
          echo "dk_id_version_majminunder=${DK_ID_VERSION_MAJMINUNDER}" | tee -a "$GITHUB_OUTPUT"

          # --trust-local-package options for dk0's consumer-side import trust
          # checks (unknown producer keys are denied by default and CI has no
          # terminal to accept them): this repository's own package plus every
          # package listed in the trust-packages input.
          DK_TRUST_OPTIONS="--trust-local-package ${DK_ID_LIBRARY}"
          for trust_package in ${{ env.INPUTTRUSTPACKAGES }}; do
            DK_TRUST_OPTIONS="${DK_TRUST_OPTIONS} --trust-local-package ${trust_package}"
          done
          echo "dk_trust_options=${DK_TRUST_OPTIONS}" | tee -a "$GITHUB_OUTPUT"

      - name: Check Key Pairs # Must be after 'dk-vars' step for correct error message
        if: inputs.pubkey == '' || inputs.seckey == ''
        shell: bash
        # Produce message like:
        # > Distribution keypair missing. You need to populate 'distribute_2_4_pubkey' and 'distribute_2_4_seckey' in the Secrets for your workflow. See more in https://docs.github.com/en/actions/security-guides/encrypted-secrets. Then set the 'pubkey' and 'seckey' inputs in the 'with:' block of the workflow step, like: pubkey: ${{ secrets.distribute_2_4_pubkey }} seckey: ${{ secrets.distribute_2_4_seckey }}
        run: |
          echo "::error title=⛔ error hint::Distribution keypair missing. You need to populate 'distribute_${{ steps.dk-vars.outputs.dk_id_version_majminunder }}_pubkey' and 'distribute_${{ steps.dk-vars.outputs.dk_id_version_majminunder }}_seckey' in the Secrets for your workflow. See more in https://docs.github.com/en/actions/security-guides/encrypted-secrets. Then set the 'pubkey' and 'seckey' inputs in the 'with:' block of the workflow step, like the following on two lines: ${{ format('pubkey: {0}{1}{1} secrets.distribute_{3}_pubkey {2}{2} seckey: {0}{1}{1} secrets.distribute_{3}_seckey {2}{2}', '\$', '{', '}', steps.dk-vars.outputs.dk_id_version_majminunder) }}"
          exit 1

      # --------- Linux static toolchain ----------

      - name: Prepare Linux static toolchain
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          TARGET_ABI: ${{ inputs.target-abi || inputs.execution-abi }}
        run: |
          if command -v dnf > /dev/null 2>&1; then
            pkgs=(glibc-static)
            case "${{ env.TARGET_ABI }}" in
              Linux_x86_64) ;;
              Linux_arm64) ;;
              Linux_x86)
                pkgs+=(glibc-static.i686 glibc-devel.i686 libgcc.i686 libstdc++.i686 gcc-toolset-14-libstdc++-devel.i686)
                ;;
            esac
            dnf install -y "${pkgs[@]}"
          fi

      # --------- C.1: Get dksrc/dk0 ----------

      - name: Get dksrc/dk0
        if: >
          inputs.experimental-dk-owner != ''
          && (inputs.experimental-mlfront-ref == '' || inputs.experimental-mlfront-ref == 'false')
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.experimental-dk-owner }}/dk
          path: dksrc
          ref: ${{ steps.dk-vars.outputs.dk_build_version_ref }}

      - name: Get dksrc/dk0
        if: >
          inputs.experimental-dk-owner == ''
          && (inputs.experimental-mlfront-ref == '' || inputs.experimental-mlfront-ref == 'false')
        uses: actions/checkout@v6
        with:
          repository: diskuv/dk
          path: dksrc
          ref: ${{ steps.dk-vars.outputs.dk_build_version_ref }}

      # --------- C.2: Install dksrc/dk0 ----------
      - name: Check if bwrap available for sandboxing
        id: check-bwrap
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        # opam sandboxing means bubblewrap must be on Linux runners, but the manylinux images which
        # provide old glibc versions do not have bubblewrap.
        # So make the availability of bwrap be a variable for the next "Set-up OCaml" step.
        run: |
          if [ "${{ runner.os }}" != "Linux" ]; then
            echo "Non-Linux OS detected, skipping bwrap check."
            echo "disable_sandboxing=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v bwrap > /dev/null 2>&1; then
            echo "bwrap is available for sandboxing"
            echo "disable_sandboxing=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "bwrap is not available."
            echo "disable_sandboxing=true" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Set-up OCaml
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        uses: ocaml/setup-ocaml@57d9aa353e8d39677b1b9fc39637d48f27fe4a91 # v3
        with:
          ocaml-compiler: 5.4.0
          opam-disable-sandboxing: ${{ steps.check-bwrap.outputs.disable_sandboxing == 'true' }}
          #   (synced from OCAML_OPAM_REPOSITORY in MlFront/.gitlab-ci.yml)
          #   2025-12-18. fmlib_parse.0.6.2
          #   2025-11-08. dkml-c-probe.3.2.0
          #   2025-10-10. initial
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#93d44806c4a413399879355cb22fb53ba00a1ba5
          cache-prefix: dk-distribute-v2
      - name: Get MlFront
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        #   `git commit` required since `opam pin`` uses git+file://
        run: |
          git clone https://gitlab.com/dkml/build-tools/MlFront.git
          cd MlFront
          git reset --hard '${{ inputs.experimental-mlfront-ref }}'

          sh ci/localize-pristine.sh
          git config user.email "nobody@example.com"
          git config user.name "nobody"
          git add --force dune-project *.opam
          git commit -m "pristine"

          printf 'opam version: '
          opam --version
      - name: Pin Latest MlFront
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        run: cd MlFront && opam pin . --no-action -y
      - name: Install DkZero_Exec
        if: inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        # Use `./DkZero_Exec.opam` not `DkZero_Exec` to process pin-depends:[]
        run: cd MlFront && opam install ./DkZero_Exec.opam -y
      - name: Create dksrc/dk0 Wrapper on Unix
        if: runner.os != 'Windows' && inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: bash
        run: |
          install -d dksrc
          printf '#!/bin/sh\nset -euf\nopam exec -- dk0 "$@"\n' | tee dksrc/dk0
          chmod +x dksrc/dk0
      - name: Create dksrc\dk0.cmd Wrapper on Windows
        if: runner.os == 'Windows' && inputs.experimental-mlfront-ref != '' && inputs.experimental-mlfront-ref != 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dksrc -Force | Out-Null
          $content = "@echo off`nsetlocal enabledelayedexpansion`nopam exec -- dk0 %*`n"
          Set-Content -Path dksrc\dk0.cmd -Value $content -Encoding ASCII

      - name: Prepare Windows short build directory
        id: prepare-short-build-dir
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INPUTSHORTBUILDDIR: ${{ inputs.short-build-dir }}
        run: |
          $shortDir = "${{ env.INPUTSHORTBUILDDIR }}"
          if ([string]::IsNullOrWhiteSpace($shortDir)) {
            "workspace_dir=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "dk_extra_options=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "cache_paths=t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          if (-not [System.IO.Path]::IsPathRooted($shortDir)) {
            throw "The short-build-dir input must be an absolute path. Got: $shortDir"
          }

          if (Test-Path -LiteralPath $shortDir) {
            Remove-Item -LiteralPath $shortDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $shortDir -Force | Out-Null
          foreach ($subdir in @('c', 'd', 'k')) {
            New-Item -ItemType Directory -Path (Join-Path $shortDir $subdir) -Force | Out-Null
          }

          $workspaceDir = Join-Path $shortDir 'w'
          New-Item -ItemType Junction -Path $workspaceDir -Target $env:GITHUB_WORKSPACE | Out-Null

          "workspace_dir=$workspaceDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dk_extra_options=--keys-dir $shortDir\\k --data-dir $shortDir\\d --cache-dir $shortDir\\c" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache_paths<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$shortDir\\c" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$shortDir\\d" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$shortDir\\k" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # --------- E.1 Cache Restore ----------
      - name: Cache restore dk stores
        if: inputs.store == 'cache'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: restore-cache-dk-distribute
        with:
            # The data stores (and build keys) are safe to share between Windows, macOS and Linux
            enableCrossOsArchive: true
            #   SYNC: must match Cache Save below
            path: ${{ runner.os == 'Windows' && inputs.short-build-dir != '' && steps.prepare-short-build-dir.outputs.cache_paths || 't' }}
            #   SYNC: must match Cache Save below. The dist part scopes the cache
            #   per slot so parallel matrix jobs do not collide on one run_id key
            #   (each slot then restores and resumes its own build).
            key: dk-stores-and-keys-x1-${{ steps.dk-vars.outputs.dk_build_version_majmin }}-${{ steps.dk-vars.outputs.dk_dist_part }}-${{ github.run_id }} # update cache on every run
            restore-keys: dk-stores-and-keys-x1-${{ steps.dk-vars.outputs.dk_build_version_majmin }}-${{ steps.dk-vars.outputs.dk_dist_part }}             # use latest cache for this slot


      # --------- G.1 Distribute ----------

      - name: Distribute on Unix
        env:
          GH_TOKEN: ${{ github.token }}
          DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
          DK_BUILD_SECKEY: "${{ inputs.seckey }}"
          INPUTOPTIONS: >-
            ${{ inputs.options }}
            -n ${{ steps.dk-vars.outputs.dk_build_number }}
            ${{ steps.dk-vars.outputs.dk_trust_options }}
            ${{ inputs.execution-abi && format('--execution-abi {0}', inputs.execution-abi) }}
            ${{ inputs.target-abi && format('--target-abi {0}', inputs.target-abi) }}
          INPUTDISTSCRIPT: ${{ inputs.distscript }}
          INPUTSTANDALONE: ${{ inputs.standalone }}
        shell: bash
        if: runner.os != 'Windows'
        # --errors-plain option helps cross-platform CI caches since the cache+data is under the project t/ subdirectory
        run: |
          # ---- Transfer producer-key trust, then clear the import dir ----
          # The committed etc/dk/i values files are the workspace's prior-import
          # trust anchors (dk0's consumer trust scans them alongside the records
          # in etc/dk/t). Copy them into etc/dk/t before wiping etc/dk/i so
          # `update` imports fresh (latest) releases without re-prompting for
          # already-trusted producer keys. etc/dk/t is not an include directory,
          # so no stale release values or traces are ever resolved from it.
          if [ -d etc/dk/i ]; then
            install -d etc/dk/t
            cp -p etc/dk/i/*.values.json etc/dk/t/ 2>/dev/null || true
          fi
          rm -rf etc/dk/i

          # ---- Restore previous release as a lazy build cache ----
          # Seeds the trace store (t/c) and lazy value pointers (t/d) from the
          # most recent published release of this major.minor line that is
          # strictly older than the tag being built, so this run gets
          # incremental cache hits without a 10GB all-or-nothing CI cache. dk0
          # resolves the previous tag itself with its embedded GitHub CLI, so no
          # host `gh` is needed (e.g. inside a manylinux container). Only value-
          # store indexes are fetched eagerly; value blobs are range-fetched on
          # demand by `distribute`. Best-effort: any failure (including an
          # unavailable release listing) degrades to a cold build.
          if [ "${{ inputs.store }}" = "release" ]; then
            echo "dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD restore github-l2 ${{ github.repository }} --tag-before ${{ github.ref_name }}"
            dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD restore github-l2 "${{ github.repository }}" --tag-before "${{ github.ref_name }}" \
              || echo "::warning title=dk-distribute::restore from a previous release failed; building from scratch"
          fi

          echo "dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD update"
          dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD update

          echo "dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_dist_part }} --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' --diff - --diff dk-patches/${{ steps.dk-vars.outputs.dk_dist_part }}.patch "${{ env.INPUTDISTSCRIPT }}""
          install -d dk-patches
          dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_dist_part }} --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' --diff - --diff dk-patches/${{ steps.dk-vars.outputs.dk_dist_part }}.patch ${{ env.INPUTDISTSCRIPT }}

          # --keys-env DK_BUILD lets combine sign the combined distribution's
          # canonical build payload with the distribution key.
          if [ "${{ env.INPUTSTANDALONE }}" == "true" ]; then
            echo "dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'"
            dksrc/dk0 --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'
          fi

          du -sh dk-dist/*

      - name: Query traces on Unix
        env:
            DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
            DK_BUILD_SECKEY: "${{ inputs.seckey }}"
            OCAMLRUNPARAM: b
        shell: bash
        if: runner.os != 'Windows'
        run: |
          dksrc/dk0 --errors-plain ${{ inputs.options }} --keys-env DK_BUILD query

      - name: Distribute on Windows
        env:
          GH_TOKEN: ${{ github.token }}
          DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
          DK_BUILD_SECKEY: "${{ inputs.seckey }}"
          INPUTWORKSPACEDIR: ${{ steps.prepare-short-build-dir.outputs.workspace_dir }}
          INPUTWINDOWOPTIONS: ${{ steps.prepare-short-build-dir.outputs.dk_extra_options }}
          INPUTOPTIONS: >-
            ${{ inputs.options }}
            -n ${{ steps.dk-vars.outputs.dk_build_number }}
            ${{ steps.dk-vars.outputs.dk_trust_options }}
            ${{ steps.prepare-short-build-dir.outputs.dk_extra_options }}
            ${{ inputs.execution-abi && format('--execution-abi {0}', inputs.execution-abi) }}
            ${{ inputs.target-abi && format('--target-abi {0}', inputs.target-abi) }}
          INPUTDISTSCRIPT: ${{ inputs.distscript }}
          INPUTSTANDALONE: ${{ inputs.standalone }}
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Push-Location "${{ env.INPUTWORKSPACEDIR }}"
          try {
            # ---- Transfer producer-key trust, then clear the import dir ----
            # The committed etc/dk/i values files are the workspace's prior-import
            # trust anchors (dk0's consumer trust scans them alongside the records
            # in etc/dk/t). Copy them into etc/dk/t before wiping etc/dk/i so
            # `update` imports fresh (latest) releases without re-prompting for
            # already-trusted producer keys. etc/dk/t is not an include directory,
            # so no stale release values or traces are ever resolved from it.
            if (Test-Path etc/dk/i) {
              New-Item -ItemType Directory -Force etc/dk/t | Out-Null
              Get-ChildItem etc/dk/i -Filter *.values.json -File -ErrorAction SilentlyContinue |
                Copy-Item -Destination etc/dk/t -Force
              Remove-Item -Recurse -Force etc/dk/i
            }

            # ---- Restore previous release as a lazy build cache ----
            # Seeds t/c (traces) and t/d (lazy value pointers) from the most
            # recent published release of this major.minor line that is strictly
            # older than the tag being built. dk0 resolves the previous tag
            # itself with its embedded GitHub CLI, so no host `gh` is needed.
            # Only value-store indexes are fetched eagerly; value blobs are
            # range-fetched on demand by `distribute`. Best-effort: any failure
            # (including an unavailable release listing) -> cold build.
            if ("${{ inputs.store }}" -eq "release") {
              Write-Host "dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD restore github-l2 ${{ github.repository }} --tag-before ${{ github.ref_name }}"
              dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD restore github-l2 "${{ github.repository }}" --tag-before "${{ github.ref_name }}"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::warning title=dk-distribute::restore from a previous release failed; building from scratch"
              }
            }

            Write-Host "dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD update"
            dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD update
            if ($LASTEXITCODE -ne 0) {
              throw "dk0 update failed with exit code $LASTEXITCODE"
            }

            Write-Host "dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_dist_part }} --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' --diff - --diff dk-patches/${{ steps.dk-vars.outputs.dk_dist_part }}.patch ${{ env.INPUTDISTSCRIPT }}"
            if (-not (Test-Path dk-patches)) { New-Item -ItemType Directory -Path dk-patches | Out-Null }
            dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose distribute ${{ steps.dk-vars.outputs.dk_dist_part }} --library '${{ steps.dk-vars.outputs.dk_id_library }}@${{ steps.dk-vars.outputs.dk_id_version }}' --diff - --diff dk-patches/${{ steps.dk-vars.outputs.dk_dist_part }}.patch ${{ env.INPUTDISTSCRIPT }}
            if ($LASTEXITCODE -ne 0) {
              throw "dk0 distribute failed with exit code $LASTEXITCODE"
            }

            # --keys-env DK_BUILD lets combine sign the combined distribution's
            # canonical build payload with the distribution key.
            if ("${{ env.INPUTSTANDALONE }}" -eq "true") {
              Write-Host "dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'"
              dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} --keys-env DK_BUILD --verbose combine --origin-name '${{ steps.dk-vars.outputs.dk_id_library }}' --mirror '${{github.server_url}}/${{github.repository}}/releases/download/${{github.ref_name}}'
              if ($LASTEXITCODE -ne 0) {
                throw "dk0 combine failed with exit code $LASTEXITCODE"
              }
            }

            Get-ChildItem -Directory dk-dist | ForEach-Object {
                $size = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
                $sizeGB = [math]::Round($size / 1GB, 2)
                Write-Output "$($sizeGB) GB`t$($_.Name)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Query traces on Windows
        env:
            DK_BUILD_PUBKEY: "${{ inputs.pubkey }}"
            DK_BUILD_SECKEY: "${{ inputs.seckey }}"
            OCAMLRUNPARAM: b
            INPUTWORKSPACEDIR: ${{ steps.prepare-short-build-dir.outputs.workspace_dir }}
            INPUTWINDOWOPTIONS: ${{ steps.prepare-short-build-dir.outputs.dk_extra_options }}
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Push-Location "${{ env.INPUTWORKSPACEDIR }}"
          try {
            dksrc\dk0.cmd --errors-plain ${{ inputs.options }} ${{ env.INPUTWINDOWOPTIONS }} --keys-env DK_BUILD query
            if ($LASTEXITCODE -ne 0) {
              throw "dk0 query failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      # --------- G.2 Publish flat object assets ----------
      # For each requested object, extract a whole zip member (ex. the runnable
      # bin/dk0.exe) from the freshly-built value store into dk-dist/ so it is
      # carried by "Share distribution artifacts" and thus combined, attested and
      # released alongside the content-addressed store. The slot is the distscript
      # basename (matches dk_dist_part); the asset is <name>-<abi>[.exe]. The
      # globals mirror the distribute step MINUS `-n` (the build-number stamp is
      # distribute-only): options (ex. -nosysinc), the trust options (so the local
      # producer key is accepted without a terminal prompt), and the abi wildcards.
      - name: Publish flat object assets on Unix
        if: runner.os != 'Windows' && inputs.publish-objects != '' && inputs.standalone != 'true'
        env:
          INPUTOPTIONS: >-
            ${{ inputs.options }}
            ${{ steps.dk-vars.outputs.dk_trust_options }}
            ${{ inputs.execution-abi && format('--execution-abi {0}', inputs.execution-abi) }}
            ${{ inputs.target-abi && format('--target-abi {0}', inputs.target-abi) }}
          INPUTDISTSCRIPT: ${{ inputs.distscript }}
          INPUTPUBLISHOBJECTS: ${{ inputs.publish-objects }}
        shell: bash
        run: |
          set -euf
          slot=$(basename "${INPUTDISTSCRIPT}"); slot="${slot%%.*}"
          abi=$(printf '%s' "$slot" | tr '[:upper:]' '[:lower:]')
          case "$slot" in Windows_*) exe=".exe" ;; *) exe="" ;; esac
          # here-string (not a pipe) so the loop runs in this shell and a failing
          # get-object aborts the step via set -e
          while IFS='|' read -r obj member name; do
            [ -n "${obj:-}" ] || continue
            out="dk-dist/${name}-${abi}${exe}"
            echo "publish-objects: dksrc/dk0 get-object ${obj} -s Release.${slot} -m ${member} -f ${out}"
            dksrc/dk0 --errors-plain ${INPUTOPTIONS} get-object "${obj}" -s "Release.${slot}" -m "${member}" -f "${out}"
          done <<< "${INPUTPUBLISHOBJECTS}"
          ls -l dk-dist/

      - name: Publish flat object assets on Windows
        if: runner.os == 'Windows' && inputs.publish-objects != '' && inputs.standalone != 'true'
        env:
          INPUTWORKSPACEDIR: ${{ steps.prepare-short-build-dir.outputs.workspace_dir }}
          INPUTOPTIONS: >-
            ${{ inputs.options }}
            ${{ steps.dk-vars.outputs.dk_trust_options }}
            ${{ steps.prepare-short-build-dir.outputs.dk_extra_options }}
            ${{ inputs.execution-abi && format('--execution-abi {0}', inputs.execution-abi) }}
            ${{ inputs.target-abi && format('--target-abi {0}', inputs.target-abi) }}
          INPUTDISTSCRIPT: ${{ inputs.distscript }}
          INPUTPUBLISHOBJECTS: ${{ inputs.publish-objects }}
        shell: pwsh
        run: |
          Push-Location "${{ env.INPUTWORKSPACEDIR }}"
          try {
            $base = Split-Path -Leaf "${{ env.INPUTDISTSCRIPT }}"
            $slot = if ($base.Contains('.')) { $base.Substring(0, $base.IndexOf('.')) } else { $base }
            $abi  = $slot.ToLowerInvariant()
            $exe  = if ($slot -like 'Windows_*') { '.exe' } else { '' }
            foreach ($line in ($env:INPUTPUBLISHOBJECTS -split "`n")) {
              $line = $line.Trim()
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts  = $line -split '\|'
              $obj    = $parts[0]; $member = $parts[1]; $name = $parts[2]
              $out    = "dk-dist/$name-$abi$exe"
              Write-Host "publish-objects: dksrc\dk0.cmd get-object $obj -s Release.$slot -m $member -f $out"
              dksrc\dk0.cmd --errors-plain ${{ env.INPUTOPTIONS }} get-object "$obj" -s "Release.$slot" -m "$member" -f "$out"
              if ($LASTEXITCODE -ne 0) { throw "get-object failed for $obj (exit $LASTEXITCODE)" }
            }
            Get-ChildItem dk-dist | Format-Table Name,Length
          }
          finally {
            Pop-Location
          }

      - name: Document Import Command
        shell: bash
        env:
          INPUTSTANDALONE: ${{ inputs.standalone }}
        run: |
          if [ "${{ env.INPUTSTANDALONE }}" == "true" ]; then
            # parse options
            tag='${{ github.ref_name }}'
            repository='${{ github.repository }}'
            capture() {
              printf "%s\n" "$@" >> "$GITHUB_STEP_SUMMARY"
              printf "%s\n" "$@" >> '.dist-CHANGELOG.txt'
            }
            if [ -z "$repository" ]; then
              echo "Error: repository is required" >&2
              usage
            fi
            if [ -z "$tag" ]; then
              echo "Error: tag is required" >&2
              usage
            fi

            capture "### Importing this package version"
            capture ''
            capture '```'

            printf "./dk0 add github-l2 %s@%s\n" "$repository" "$tag"
            capture "./dk0 add github-l2 ${repository}@${tag}"
            capture '```'

            capture ''
            capture "### Importing the latest package version"
            capture ''
            capture '```'

            printf "./dk0 add github-l2 %s\n" "$repository"
            capture "./dk0 add github-l2 ${repository}"
            capture '```'
          fi

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          # ex. t/p/476/zx3y/l/Release.Agnostic/stdout.log
          path: t/p/*/*/l/*/

      - name: Save patches
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patches
          path: dk-patches/

      - name: Share distribution artifacts
        if: inputs.standalone != 'true'
        uses: actions/upload-artifact@v7
        with:
          # distribution-<part>. That is, distribution-<basename(distscript)>[-<targetabi>]
          name: distribution-${{ steps.dk-vars.outputs.dk_dist_part }}
          path: dk-dist/

      # --------- X.1 Cache Save ----------
      # `always()` so a build that FAILS (e.g. a value-id `--diff` exit 3 during a
      # harvest) or is CANCELLED (job hits the runner time limit) still persists
      # its value/trace stores. The next run restores this slot's cache and
      # resumes, so an interrupted multi-hour closure build never restarts from
      # scratch and a harvest round's build is reused by the fill round.
      - name: Cache save dk stores
        if: always() && inputs.store == 'cache' && steps.restore-cache-dk-distribute.outputs.cache-hit == ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: save-cache-dk-distribute
        with:
            # The data stores (and build keys) are safe to share between Windows, macOS and Linux
            enableCrossOsArchive: true
            #   SYNC: must match Cache Load above
            path: ${{ runner.os == 'Windows' && inputs.short-build-dir != '' && steps.prepare-short-build-dir.outputs.cache_paths || 't' }}
            #   SYNC: must match Cache Load above
            key: dk-stores-and-keys-x1-${{ steps.dk-vars.outputs.dk_build_version_majmin }}-${{ steps.dk-vars.outputs.dk_dist_part }}-${{ github.run_id }} # update cache on every run
